<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080b">
  <title>STREETO - offline</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    :root { color-scheme: dark; --neon: #1fe0ff; --bg: #07080b; --panel: #12161d; --text: #f4f7fa; --muted: #8a96a8; }
    * { box-sizing: border-box; }
    body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 28px; background: radial-gradient(900px 500px at 75% 0%, rgba(31,224,255,.1), transparent 65%), var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; }
    main { width: min(520px, 100%); padding: 32px 26px; border: 1px solid rgba(255,255,255,.12); border-radius: 20px; background: var(--panel); box-shadow: 0 24px 60px -30px #000; text-align: center; }
    img { width: 96px; height: 96px; margin: 0 auto 18px; border-radius: 22px; }
    h1 { margin: 0 0 10px; font-family: Oswald, Impact, sans-serif; letter-spacing: .08em; text-transform: uppercase; font-size: clamp(2rem, 9vw, 3rem); }
    p { margin: 0 auto 24px; max-width: 38ch; color: var(--muted); line-height: 1.55; }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 22px; border-radius: 999px; background: var(--neon); color: #06121a; text-decoration: none; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="STREETO">
    <h1 data-offline-title>No connection</h1>
    <p data-offline-body>STREETO could not be reached. Check your connection and try again.</p>
    <a href="/" data-offline-retry>Try again</a>
  </main>
  <script>
    (function () {
      var copy = {
        en: {
          doc: 'STREETO - offline',
          title: 'No connection',
          body: 'STREETO could not be reached. Check your connection and try again.',
          retry: 'Try again'
        },
        ka: {
          doc: 'STREETO - კავშირი არ არის',
          title: 'კავშირი არ არის',
          body: 'STREETO-ს ვერ დავუკავშირდით. შეამოწმეთ ინტერნეტი და სცადეთ ხელახლა.',
          retry: 'სცადეთ ხელახლა'
        }
      };

      function cookie(name) {
        var parts = String(document.cookie || '').split(';');
        for (var i = 0; i < parts.length; i += 1) {
          var item = parts[i].trim();
          if (item.indexOf(name + '=') === 0) {
            try { return decodeURIComponent(item.slice(name.length + 1)); } catch (error) { return ''; }
          }
        }
        return '';
      }

      var selected = '';
      try { selected = localStorage.getItem('streeto.lang') || ''; } catch (error) { /* private mode */ }
      if (!selected) selected = cookie('streeto.lang.hint');
      if (selected !== 'en' && selected !== 'ka') {
        selected = String(navigator.language || '').toLowerCase().indexOf('ka') === 0 ? 'ka' : 'en';
      }

      var text = copy[selected] || copy.en;
      document.documentElement.lang = selected;
      document.title = text.doc;
      var title = document.querySelector('[data-offline-title]');
      var body = document.querySelector('[data-offline-body]');
      var retry = document.querySelector('[data-offline-retry]');
      if (title) title.textContent = text.title;
      if (body) body.textContent = text.body;
      if (retry) retry.textContent = text.retry;
    })();
  </script>
</body>
</html>
